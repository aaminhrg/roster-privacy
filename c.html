<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Business card &middot; Roster@</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F3F4F7; --surface: #FFFFFF; --raised: #E9ECF1; --text: #0B0C0F; --muted: #687080;
    --accent: #0B0C0F; --on-accent: #FFFFFF; --card: #1F3A5F;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0B0C0F; --surface: #16181D; --raised: #22252C; --text: #F4F5F7; --muted: #8E95A2; --accent: #C8F169; --on-accent: #0B0C0F; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; }
  .card { aspect-ratio: 1086 / 648; border-radius: 24px; background: var(--card); color: #fff; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .mono { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-weight: 600; font-size: 18px; }
  .company { font-size: 14px; opacity: .9; text-align: end; }
  .name { font-size: 26px; font-weight: 700; letter-spacing: -.3px; margin: 0; }
  .title { font-size: 15px; opacity: .9; margin: 2px 0 0; }
  .list { margin-top: 18px; background: var(--surface); border-radius: 22px; padding: 4px 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--raised); }
  .row:last-child { border-bottom: 0; }
  .row .label { color: var(--muted); font-size: 13px; }
  .row .value { font-size: 16px; overflow-wrap: anywhere; }
  .actions { display: grid; gap: 10px; margin-top: 18px; }
  .button { display: block; text-align: center; padding: 15px; border-radius: 18px; font-weight: 600; text-decoration: none; border: 0; font-size: 16px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .secondary { background: var(--raised); color: var(--text); }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 16px; }
  .empty { text-align: center; padding: 64px 0; }
</style>
</head>
<body>
<main id="app">
  <div class="empty">
    <h1>Business card</h1>
    <p>This link does not contain a card.</p>
  </div>
</main>

<script>
// The card travels after the "#" of the link. Browsers never send that part to
// the server, so this page learns about the card only inside your browser.
(function () {
  var LABELS = { mobile: 'Mobile', office: 'Office', whatsapp: 'WhatsApp', email: 'Email', web: 'Website', map: 'Directions' };

  function decode(fragment) {
    try {
      var padded = fragment.replace(/-/g, '+').replace(/_/g, '/');
      padded += '==='.slice((padded.length + 3) % 4);
      var binary = atob(padded);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var card = JSON.parse(new TextDecoder().decode(bytes));
      return card && typeof card.n === 'string' && card.n.trim() ? card : null;
    } catch (e) {
      return null;
    }
  }

  function href(type, value) {
    if (type === 'mobile' || type === 'office') return 'tel:' + value.replace(/[^\d+]/g, '');
    if (type === 'whatsapp') return 'https://wa.me/' + value.replace(/\D/g, '');
    if (type === 'email') return 'mailto:' + value;
    if (/^https?:\/\//i.test(value)) return value;
    return null;
  }

  function escapeVCard(value) {
    return String(value).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  }

  function vcard(card) {
    var parts = card.n.trim().split(/\s+/);
    var lines = ['BEGIN:VCARD', 'VERSION:3.0',
      'N:' + escapeVCard(parts.slice(1).join(' ')) + ';' + escapeVCard(parts[0]) + ';;;',
      'FN:' + escapeVCard(card.n.trim())];
    if (card.c || card.f) lines.push('ORG:' + escapeVCard(card.c || '') + (card.f ? ';' + escapeVCard(card.f) : ''));
    if (card.t) lines.push('TITLE:' + escapeVCard(card.t));
    (card.m || []).forEach(function (m) {
      if (m[0] === 'mobile' || m[0] === 'whatsapp') lines.push('TEL;TYPE=CELL:' + m[1]);
      else if (m[0] === 'office') lines.push('TEL;TYPE=WORK:' + m[1]);
      else if (m[0] === 'email') lines.push('EMAIL;TYPE=WORK:' + m[1]);
      else if (m[0] === 'web') lines.push('URL:' + m[1]);
    });
    lines.push('END:VCARD');
    return lines.join('\r\n') + '\r\n';
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  var card = decode(location.hash.slice(1));
  if (!card) return;

  var app = document.getElementById('app');
  app.textContent = '';
  document.title = card.n + ' \u00b7 Roster@';

  var face = el('div', 'card');
  var top = el('div', 'top');
  top.appendChild(el('div', 'mono', (card.c || card.n).charAt(0).toUpperCase()));
  top.appendChild(el('div', 'company', card.c || ''));
  face.appendChild(top);
  var who = el('div');
  who.appendChild(el('h1', 'name', card.n));
  if (card.t) who.appendChild(el('p', 'title', card.t + (card.f ? ' \u00b7 ' + card.f : '')));
  face.appendChild(who);
  app.appendChild(face);

  var methods = (card.m || []).filter(function (m) { return Array.isArray(m) && LABELS[m[0]] && typeof m[1] === 'string'; });
  if (methods.length) {
    var list = el('div', 'list');
    methods.forEach(function (m) {
      var link = href(m[0], m[1]);
      var row = el(link ? 'a' : 'div', 'row');
      if (link) { row.href = link; if (/^https?:/.test(link)) row.rel = 'noopener noreferrer'; }
      var text = el('div');
      text.appendChild(el('div', 'label', LABELS[m[0]]));
      text.appendChild(el('div', 'value', m[1].replace(/^https?:\/\//, '')));
      row.appendChild(text);
      list.appendChild(row);
    });
    app.appendChild(list);
  }

  var actions = el('div', 'actions');
  var save = el('a', 'button primary', 'Save to contacts');
  var file = new Blob([vcard(card)], { type: 'text/vcard' });
  save.href = URL.createObjectURL(file);
  save.download = card.n.replace(/[^\p{L}\p{N}]+/gu, '-') + '.vcf';
  actions.appendChild(save);

  var open = el('a', 'button secondary', 'Open in Roster@');
  open.href = 'businessconnection://add?url=' + encodeURIComponent(location.href);
  actions.appendChild(open);
  app.appendChild(actions);

  app.appendChild(el('p', 'note', 'Shared with Roster@, a wallet for business cards. This page does not store or send the card anywhere.'));
})();
</script>
</body>
</html>
